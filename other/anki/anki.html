<!-- templates/anki.html  ───────────────────────────────────-->
{% extends "main/base.html" %}
{% block title %}ANKI{% endblock %}
{% block css %}
<!--
<link
  href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
  rel="stylesheet"
  integrity="sha384‑LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
  crossorigin="anonymous"
/>
-->
{% endblock %}
{% block content %}
<div class="my-2">
  牌组：
  <select id="deck-select"></select>
  <button id="btn-new-deck" class="btn btn-sm btn-light">+deck</button>
</div>

<h5 id="prog-text"></h5>
<progress id="prog-bar" max="100" value="0"></progress>
<button id="btn-next"  class="btn btn-primary btn-sm mx-2">next</button>
<button id="btn-undo"  class="btn btn-warning btn-sm">undo</button>

<!-- 复习卡片盒 -->
<div id="card-box" class="my-3"></div>

<!-- 页签 -->
<ul class="nav nav-tabs my-3">
  <li class="nav-item">
    <a id="tab-add"    class="nav-link active"   href="#">ADD</a>
  </li>
  <li class="nav-item">
    <a id="tab-search" class="nav-link"          href="#">SEARCH</a>
  </li>
</ul>

<!-- ADD 面板 -->
<div id="panel-add">
  <input id="nc-front" class="form-control my-1" placeholder="front">
  <input id="nc-back"  class="form-control my-1" placeholder="back">
  <button id="submit-nc" class="btn btn-success btn-sm">submit</button>
</div>

<!-- SEARCH 面板 -->
<div id="panel-search" style="display:none">
  <input id="search-q"  class="form-control my-1" placeholder="keyword">
  <button id="btn-search" class="btn btn-info btn-sm">search</button>
  <ul id="search-result" class="list-group my-2"></ul>
</div>

<script src="{{ url_for('personal_bp.static',
            filename='js/anki/anki.js') }}"></script>
{% endblock %}
