<!DOCTYPE html>
<html lang="zh">
<!-- calendar base html -->
<head>
  <meta charset="UTF-8">
  <title> {% block title %}weatherdoll{% endblock %} </title>
  <style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden; /* 禁止整个页面滚动 */
        font-family: Arial, sans-serif;
        background: url("{{ url_for('static', filename='img/coding.avif')}}") no-repeat center/cover fixed;
    }

    a {
      text-decoration: none;
    }

    /*
    .main-outer-container {
        display: flex;
        height: 100%;
    }
    

    .main-outer-sidebar {
        width: 100px;
        background-color: rgba(121, 125, 128, 0.2);
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding:10px;
        box-sizing:border-box;
        align-items:center;
    }
    

    .main-outer-sidebar div {
        margin-bottom: 10px;
    }
    */

    .main-chat-container {
        /* 
          flex-grow: 1;
        */
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 10px;
    }

    .main-inner-container {
        display: flex;
        flex-grow: 1;
        border: 1px solid #ccc;
        overflow: hidden;
        box-sizing: border-box;
    }

    .main-inner-sidebar {
        width:100px;
        background-color: rgba(245, 241, 241,0.2);
        overflow-y: auto; /* 内部侧边栏可滚动 */
    }

    .main-inner-sidebar div{
        margin-bottom:10px;
        margin-top:10px;
        margin-left:10px;
    }

    .main-inner-content {
        flex-grow: 1;
        padding: 10px;
        overflow-y: auto; /* 内部工作区可滚动 */
        background-color: rgba(238, 242, 243, 0.03)
    }

    input[type="text"] {
        width: 40%;
        display:block;
        padding: 8px;
        box-sizing:border-box;
    }
  </style>
  {% block css %}{% endblock %}
</head>
<body>

  <!--  <div class="main-outer-container">  -->
  <!--
    <aside>
      <div class="main-outer-sidebar">
        <div>site</div>
      </div>
    </aside>
  -->
    
    <div class="main-chat-container">
      <div class="main-inner-container">
        <nav class="main-inner-sidebar">
          <div><a target="_self" href="{{url_for('calendar_bp.calendar')}}">calendar</a></div>
          <div><a target="_self" href="{{url_for('chat_bp.chat')}}">chat</a></div>
        </nav>

        <div class="main-inner-content">
          {% block content %}{% endblock %}
        </div>
      </div>
    </div>

  <!-- </div> -->
{% block js %}{% endblock %}
</body>
</html>
