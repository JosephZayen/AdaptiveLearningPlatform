{% extends "main/base.html" %}

{% block title %}
chat
{% endblock %}

{% block css %}
<style>
  #chat-main {
    width: 100%;
    height: 100%;
    display: flex;
  }

  #chat-sidebar {
    width: 20%;
    background-color: #f0f0f0;
    margin: 20px;
  }

  #chat-sidebar #sidebar-chats *{
    display: block;
    width: 100%;
    height: 30px;
    background-color: #f0f0f0;
  }

  #chat-messages {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: start;
  }

  #chat-messages #messages {
    flex: 1;
    flex-direction: column;
    display: flex;
    gap: 10px;
    width: 100%;
  }

  #chat-messages #messages * {
    width: 400px;
    height: 40px;
    background-color: #f0f0f0;
    flex: 0 0 auto;
  }

  #chat-messages #inputarea {
    height: 20px;
    width: 80%;
  }

  #chat-messages #submit {
    height: 20px;
    width: 20px;
    min-width: max-content;
    align-self: flex-start;
  }

</style>
{% endblock %}


{% block content %}
<main id="chat-main">
  <div id="chat-sidebar">
    <form id="control-plane">
      <button type="button" id="new-chat">new chat</button>
      <label for="reasoning-selector">select reasoning: </label>
      <select name="reasoning-selector" id="reasoning-selector">
        <option value="enabled">enabled</option>
        <option value="disabled" selected>disabled</option>
      </select>
      <button type="button" id="new-message-frame">new message frame</button>
    </form>

    <div id="sidebar-chats">
    </div>
  </div>
  <div id="chat-messages">
    <div id="messages">
      <!-- .message-frame  -->
    </div>
    <div id="input-area">
      <textarea id="input-content"></textarea>
      <button type="button" id="input-submit">submit</button>
    </div>
  </div>
</main>
{% endblock %}

{% block js %}
<script src="{{url_for('chat_bp.static', filename='js/chat.mjs')}}" type="module"></script>
{% endblock %}
