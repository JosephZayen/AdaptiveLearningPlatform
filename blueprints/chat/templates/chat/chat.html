{% extends "main/base.html" %}

{% block title %}
chat
{% endblock %}

{% block css %}
<style>
  #chat-main {
    width: 100%;
    height: 100%;
    display: flex;
  }

  #chat-main #chat-sidebar {
    width: 20%;
    background-color: #f0f0f0;
    margin: 20px;
  }

  #chat-main #chat-messages {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: start;
  }

  #chat-messages #messages {
    flex: 1;
  }

  #chat-messages #inputarea {
    height: 20px;
    width: 80%;
  }

  #chat-messages #submit {
    height: 20px;
    width: 20px;
    min-width: max-content;
    align-self: flex-start;
  }
</style>
{% endblock %}


{% block content %}
<main id="chat-main">
  <div id="chat-sidebar">
    <form id="control-plane">
      <button type="button" id="new-chat">new chat</button>
      <label for="reasoning-selector">select reasoning: </label>
      <select name="reasoning-selector" id="reasoning-selector">
        <option value="enabled">enabled</option>
        <option value="disabled">disabled</option>
      </select>
      <button type="button" id="new-message-frame">new message frame</button>
    </form>
  </div>
  <div id="chat-messages">
    <div id="messages">
      <!-- .message-frame  -->
    </div>
    <div id="inputarea">
      <textarea id="inputarea"></textarea>
      <button type="button" id="submit">submit</button>
    </div>
  </div>
</main>
{% endblock %}

{% block js %}
<script src="{{url_for('chat_bp.static', filename='chat.mjs')}}" type="module"></script>
{% endblock %}
