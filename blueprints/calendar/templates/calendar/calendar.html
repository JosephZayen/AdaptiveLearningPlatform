{% extends "main/base.html" %}

{% block title %}
calendar
{% endblock %}

{% block css %}
<style>
html {
  position:relative;
}
.calendar-container {
  width: 320px;
  font-family: Arial, Helvetica, sans-serif;
  border: 1px solid #d0d0d0;
  border-radius: 6px;
  padding: 10px;
  box-sizing: border-box;
  background: rgba(250,250,250,0.2);
}
.calendar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.calendar-header button {
  border: none;
  background: none;
  font-size: 1.2em;
  cursor: pointer;
}
.calendar-title {
  font-weight: bold;
  font-size: 1.1em;
}
.calendar-table {
  width: 100%;
  border-collapse: collapse;
}
.calendar-table th,
.calendar-table td {
  width: 14.28%;
  height: 30px;
  text-align: center;
  border-radius: 4px;
  cursor: pointer;
}
.calendar-table th {
  font-size: 0.92em;
  color: #888;
}
.calendar-table td {
  transition: background 0.2s;
}
.calendar-table td.today {
  background: #43A047;
  color: #fff;
}
.calendar-table td:hover {
  background: #d1e7dd;
}
.calendar-table td.disabled {
  color: #bbb;
  pointer-events: none;
  background: #f5f5f5;
}
#canvas {
  display: block;
  position:absolute;
  right: 10vw;
  top:10vh;
  height:60vh;
  width:30vw;            /* 相对视口更易自适应 */
  border-radius:12px;
  overflow:auto;
  box-shadow:0 0 5px rgba(72, 209, 209,.4);
  background-color: rgba(239, 239, 239, 1); 
}
#canvas span {
  text-align:center;
  display: block;
  font-size: 1.5em;                 
  font-weight: bold;        
  color: rgba(72, 209, 209,1);   
}
.selected {
  background-color: rgba(13, 234, 205, 0.4);
}
</style>
{% endblock %}



{% block content %}
<div class="calendar-container">
  <div class="calendar-header">
    <button id="prevMonthBtn">&#8592;</button>
    <span class="calendar-title" id="calendarTitle"></span>
    <button id="nextMonthBtn">&#8594;</button>
  </div>
  <table class="calendar-table">
    <thead>
      <tr>
        <th>日</th>
        <th>一</th>
        <th>二</th>
        <th>三</th>
        <th>四</th>
        <th>五</th>
        <th>六</th>
      </tr>
    </thead>
    <tbody id="calendarBody">
    </tbody>
  </table>
</div>

<input type="text" placeholder="event" id="input-event">
<input type="text" placeholder="time #note, please enter sth like 6:00" id="input-time">
<button type="button" id="button">submit</button>

<div id="canvas">
  <span>events</span>
  <div id="dayContent"></div>
</div>
{% endblock %}

{% block js %}
<script type="module" src="{{url_for('calendar_bp.static', filename='js/index.mjs')}}"></script>
{% endblock %}
